[package]
name = "nonwasi-text"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
[lib]
crate-type = ["cdylib", "rlib"]
[features]
default = []
sort = []
base64-work = ["dep:base64"]
wc = ["dep:unicode-segmentation"]
scan = ["dep:regex"]
csv-work = ["dep:serde_json", "dep:csv"]
query = ["dep:serde_json", "dep:jaq-core", "dep:jaq-std", "dep:jaq-json"]
zip-work = ["dep:zip"]
x25519 = ["dep:x25519-dalek"]
[dependencies]
base64 = { version = "=0.22.1", optional = true }
unicode-segmentation = { version = "=1.12.0", optional = true }
regex = { version = "=1.11.2", optional = true }
serde_json = { version = "=1.0.145", optional = true }
csv = { version = "=1.3.1", optional = true }
jaq-core = { version = "=2.2.1", optional = true }
jaq-std = { version = "=2.1.2", default-features = false, optional = true }
jaq-json = { version = "=1.1.3", features = ["serde_json"], optional = true }
zip = { version = "=2.4.2", default-features = false, optional = true }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["alloc", "precomputed-tables"], optional = true }
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
