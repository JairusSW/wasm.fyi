<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Native code bytes · wasm.fyi</title>
<style>body{background:#101010;color:#eee;font:14px monospace;margin:24px}select,a{color:inherit}select{background:#222;padding:8px}pre{overflow:auto;line-height:1.6}#status{color:#aaa}</style>
<h1>Native code bytes</h1>
<p>Verified engine image, including any embedded data. This is a hex view, not disassembly.</p>
<select id="trials" aria-label="Workload"></select> <a id="download">Download bytes</a>
<p id="status"></p><pre id="bytes"></pre>
<script type="module">
const select=document.querySelector('#trials'),status=document.querySelector('#status'),output=document.querySelector('#bytes'),download=document.querySelector('#download');
try {
 const response=await fetch('index.json');if(!response.ok)throw Error('Index unavailable');
 const index=await response.json();
 for(const record of index.records){const option=document.createElement('option');option.value=record.trial;option.textContent=`${record.workload} · ${record.runtime}`;select.append(option);}
 const requested=new URL(location.href).searchParams.get('trial');if(index.records.some(r=>r.trial===requested))select.value=requested;
 let generation=0;
 async function show(){const current=++generation,record=index.records.find(r=>r.trial===select.value);if(!record)return;status.textContent='Loading…';output.textContent='';
  try{if(!/^trial-[A-Za-z0-9._-]+\.bin$/.test(record.imageFile))throw Error('Invalid image path');const response=await fetch(record.imageFile);if(!response.ok)throw Error('Image unavailable');const data=new Uint8Array(await response.arrayBuffer());const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',data)),b=>b.toString(16).padStart(2,'0')).join('');if(hash!==record.image.sha256||data.length!==record.imageBytes)throw Error('Image identity mismatch');if(current!==generation)return;
   status.textContent=`${record.image.backend} · ${record.image.architecture} · ${data.length} bytes · SHA-256 ${hash}`;download.href=record.imageFile;download.download=record.imageFile;const lines=[];for(let i=0;i<data.length;i+=16)lines.push(i.toString(16).padStart(8,'0')+'  '+Array.from(data.subarray(i,i+16),b=>b.toString(16).padStart(2,'0')).join(' '));output.textContent=lines.join('\n');
  }catch(error){if(current===generation)status.textContent=error.message;}}
 select.addEventListener('change',show);await show();
}catch(error){status.textContent=error.message;}
</script>
