name: Deploy Remote
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wasm-fyi-production
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify-current.yml
  cli-binaries:
    needs: verify
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: service
      - uses: actions/setup-go@v5
        with:
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum
      - name: Build and smoke-test native CLI
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          mkdir -p package/bin cli
          flags="-s -w -X main.cliVersion=$GITHUB_SHA"
          if [ "$TARGET_OS" = linux ]; then flags="$flags -linkmode external -extldflags -static"; fi
          (cd service && CGO_ENABLED=1 GOWORK=off GOFLAGS=-mod=readonly go build -tags sqlite_omit_load_extension,netgo,osusergo -trimpath -ldflags="$flags" -o ../package/bin/wasmfyi ./cmd/wasmfyi)
          test "$(package/bin/wasmfyi version)" = "wasmfyi $GITHUB_SHA"
          package/bin/wasmfyi --help
          COPYFILE_DISABLE=1 tar -czf "cli/wasmfyi-$TARGET_OS-$TARGET_ARCH.tar.gz" -C package bin
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: cli/*.tar.gz
          retention-days: 7
  build:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /schemas/
            /service/
            /scripts/
            /corpora/
            /adapters/
            /patches/
            /static/install.sh
            /static/favicon.svg
            /static/brand/
            /static/fonts/
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Bake and verify latest results in production HTML
        run: pnpm build:production
        env:
          BASE_PATH: ''
      - name: Package frontend and build static API
        run: |
          mkdir -p release/frontend
          cp -a build/. release/frontend/
          cp static/install.sh release/frontend/install.sh
          mkdir -p "release/frontend/cli/$GITHUB_SHA"
          node scripts/package-cli.mjs "release/frontend/cli/$GITHUB_SHA/assets.tar.gz"
          (cd service && CGO_ENABLED=1 GOWORK=off GOFLAGS=-mod=readonly go build -tags sqlite_omit_load_extension,netgo,osusergo -trimpath -ldflags='-s -w -linkmode external -extldflags -static' -o ../release/wasmfyi ./cmd/wasmfyi)
      - uses: actions/upload-artifact@v4
        with:
          name: production-release
          path: release/
          include-hidden-files: true
          retention-days: 7
  deploy:
    needs: [verify, build, cli-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://wasm.fyi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-release
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: release/frontend/cli/${{ github.sha }}
          merge-multiple: true
      - name: Verify and index CLI downloads
        run: |
          cd "release/frontend/cli/$GITHUB_SHA"
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            test -s "wasmfyi-$target.tar.gz"
          done
          test -s assets.tar.gz
          sha256sum *.tar.gz > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > ../latest.txt
      - name: Verify homepage regeneration artifacts
        run: |
          for file in .homepage-baker.mjs .homepage-watch.py .homepage.service .homepage.timer; do
            test -f "release/frontend/$file"
          done
      - name: Upload and activate release
        env:
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_DEPLOY_KEY: ${{ secrets.REMOTE_DEPLOY_KEY }}
          REMOTE_KNOWN_HOSTS: ${{ secrets.REMOTE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$REMOTE_DEPLOY_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$REMOTE_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy-ssh/key" "$RUNNER_TEMP/deploy-ssh/known_hosts"
          trap 'rm -f "$RUNNER_TEMP/deploy-ssh/key"' EXIT
          target="$REMOTE_USER@$REMOTE_HOST"
          transport="ssh -i $RUNNER_TEMP/deploy-ssh/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts -o ConnectTimeout=15"
          $transport "$target" "mkdir -p /var/lib/wasmfyi-deploy/incoming/$GITHUB_SHA"
          rsync -a --delete -e "$transport" release/ "$target:/var/lib/wasmfyi-deploy/incoming/$GITHUB_SHA/"
          $transport "$target" "sudo -n /usr/local/sbin/wasmfyi-activate $GITHUB_SHA"
          deployed=$($transport "$target" 'cat /opt/wasmfyi/current/commit')
          test "$deployed" = "$GITHUB_SHA"
          curl --fail --retry 3 --retry-delay 2 https://wasm.fyi/healthz
