name: Verify corpus sources and V8 oracles
on:
  pull_request:
    paths: ['corpora/**', 'scripts/**', 'wasmbench.config.json', '.github/workflows/corpus.yml']
  push:
    branches-ignore: [main]
    paths: ['corpora/**', 'scripts/**', 'wasmbench.config.json', '.github/workflows/corpus.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.4.0'
      - uses: actions/cache@v5
        with:
          path: ~/.local/share/wasm-fyi/toolchains
          key: corpus-linux-x64-llvm-22.1.8-wasm-tools-1.260.0
      - name: Install pinned compilers
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown,wasm32-wasip1
          node scripts/llvm-toolchain.mjs
          cargo install wasm-tools --version 1.260.0 --locked --root "$HOME/.local/share/wasm-fyi/toolchains/wasm-tools-1.260.0"
      - name: Install pinned component conformance runtime
        run: |
          curl --fail --location --retry 3 https://github.com/bytecodealliance/wasmtime/releases/download/v46.0.1/wasmtime-v46.0.1-x86_64-linux.tar.xz -o /tmp/wasmtime.tar.xz
          echo '9ae0b17ea298bcc52277a8208d6ab7fae8e1a89579672f9d82f9d86c116edb62  /tmp/wasmtime.tar.xz' | sha256sum -c -
          tar -xJf /tmp/wasmtime.tar.xz -C /tmp
          sudo install /tmp/wasmtime-v46.0.1-x86_64-linux/wasmtime /usr/local/bin/wasmtime
      - name: Verify curated execution kernels and upstream positive semantics
        env:
          WASMBENCH_WASM_TOOLS: /home/runner/.local/share/wasm-fyi/toolchains/wasm-tools-1.260.0/bin/wasm-tools
        run: |
          node --test scripts/feature-curation.test.mjs scripts/feature-upstream-v8.test.mjs
          node scripts/feature-curation-check.mjs --require-all
          node scripts/feature-upstream-spec.mjs --require-all
          node corpora/features/upstream/runner-regression.mjs
          node scripts/feature-upstream-v8.mjs --require-all
          node scripts/feature-upstream-components.mjs --require-all
      - name: Verify committed inputs and execution
        run: |
          node --test scripts/workflow.test.mjs scripts/corpus-build-all.test.mjs scripts/source-build-toolchains.test.mjs scripts/age-toolchain.test.mjs scripts/corpus-native-ports.test.mjs scripts/corpus-source-manifest.test.mjs scripts/application-corpus.test.mjs scripts/corpus-v8.test.mjs scripts/upstream-sources.test.mjs scripts/feature-adapter.test.mjs
          node scripts/corpus-v8.mjs --local
      - name: Recompile editable sources and verify again
        env:
          WASMBENCH_CLANG: /home/runner/.local/share/wasm-fyi/toolchains/llvm-22/bin/clang
          WASMBENCH_WASM_TOOLS: /home/runner/.local/share/wasm-fyi/toolchains/wasm-tools-1.260.0/bin/wasm-tools
        run: |
          corpus_tool_bin=$(dirname "$WASMBENCH_WASM_TOOLS")
          export PATH="$corpus_tool_bin:$PATH"
          node scripts/application-corpus.mjs build
          node scripts/feature-corpus.mjs build
          git diff --exit-code -- corpora/applications/artifacts corpora/features/artifacts corpora/features/sources
          node scripts/corpus-v8.mjs --local
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: corpus-v8-correctness
          path: |
            .wasmbench/corpus-v8-check.json
            .wasmbench/feature-curation-check.json
            .wasmbench/feature-upstream-*.json

  all-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      WASMBENCH_CLANG: /home/runner/.local/share/wasm-fyi/toolchains/llvm-22/bin/clang
      WASMBENCH_WASM_TOOLS: /home/runner/.local/share/wasm-fyi/toolchains/wasm-tools-1.260.0/bin/wasm-tools
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.4.0'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/wasm-fyi/toolchains
            ~/.cargo/registry
            ~/.cargo/git
          key: corpus-all-sources-linux-x64-rust-1.98.1-llvm-22.1.8-wasm-tools-1.260.0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y cmake ninja-build wabt make curl unzip
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown,wasm32-wasip1
          node scripts/llvm-toolchain.mjs
          cargo install wasm-tools --version 1.260.0 --locked --root "$HOME/.local/share/wasm-fyi/toolchains/wasm-tools-1.260.0"
          curl --fail --location --retry 3 https://github.com/bytecodealliance/wasmtime/releases/download/v46.0.1/wasmtime-v46.0.1-x86_64-linux.tar.xz -o /tmp/wasmtime.tar.xz
          echo '9ae0b17ea298bcc52277a8208d6ab7fae8e1a89579672f9d82f9d86c116edb62  /tmp/wasmtime.tar.xz' | sha256sum -c -
          tar -xJf /tmp/wasmtime.tar.xz -C /tmp
          sudo install /tmp/wasmtime-v46.0.1-x86_64-linux/wasmtime /usr/local/bin/wasmtime
      - name: Build pinned Binaryen for Lua exception translation
        run: |
          binaryen_source="$RUNNER_TEMP/binaryen-130-source"
          binaryen_build="$RUNNER_TEMP/binaryen-130-build"
          git init --quiet "$binaryen_source"
          git -C "$binaryen_source" remote add origin https://github.com/WebAssembly/binaryen.git
          git -C "$binaryen_source" fetch --depth=1 origin 5d704ad52bc77a258e8fa3f9d34fcc5e8799c1c3
          git -C "$binaryen_source" checkout --detach FETCH_HEAD
          test "$(git -C "$binaryen_source" rev-parse HEAD)" = 5d704ad52bc77a258e8fa3f9d34fcc5e8799c1c3
          cmake -S "$binaryen_source" -B "$binaryen_build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build "$binaryen_build" --target wasm-opt --parallel 2
          test "$("$binaryen_build/bin/wasm-opt" --version)" = 'wasm-opt version 130'
          echo "WASM_OPT=$binaryen_build/bin/wasm-opt" >> "$GITHUB_ENV"
      - name: Build every corpus from source and check execution
        env:
          # setup-go exports local; age's pinned go.mod selects Go 1.27.0.
          GOTOOLCHAIN: auto
        run: |
          corpus_tool_bin=$(dirname "$WASMBENCH_WASM_TOOLS")
          export PATH="$corpus_tool_bin:$PATH"
          node scripts/corpus-build-all.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: all-corpus-source-verification
          path: |
            .wasmbench/upstream/*.json
            .wasmbench/source-builds/*/report.json
            .wasmbench/source-builds/*/inputs.json
            .wasmbench/source-builds/*/recipe.mjs
            .wasmbench/source-builds/*/lib/source-build-toolchains.mjs
            .wasmbench/corpus-v8-check.json
            .wasmbench/corpus-components-check.json
