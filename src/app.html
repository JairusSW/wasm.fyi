<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0d0e10" />
		<link rel="icon" href="%sveltekit.assets%/brand/favicon-dots.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/brand/favicon-32.png" type="image/png" sizes="32x32" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/brand/favicon-180.png" sizes="180x180" />
		<link rel="icon" href="%sveltekit.assets%/brand/favicon-512.png" type="image/png" sizes="512x512" />
		<script>
			var savedTheme;
			try { savedTheme = localStorage.getItem('theme'); } catch (e) {}
			var manualTheme = savedTheme === 'light' || savedTheme === 'dark';
			var theme = manualTheme ? savedTheme : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			document.documentElement.dataset.theme = theme;
			if (manualTheme) document.documentElement.dataset.themePreference = theme;
			document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f6f6f4' : '#0d0e10';
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
